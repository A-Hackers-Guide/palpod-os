# ─────────────────────────────────────────────────────────────────────────────
# Example RustDesk Client config for a PAL Pod household.
#
# Where this file lives on disk (per client OS):
#   Linux    ~/.config/rustdesk/RustDesk.toml
#   macOS    ~/Library/Preferences/com.carriez.RustDesk/RustDesk.toml
#   Windows  %APPDATA%\RustDesk\config\RustDesk.toml
#
# Replace `palpod.local` with the Pod's LAN IP if you don't have mDNS.
# Replace the KEY placeholder with the contents of
# ./data/rustdesk-keys/id_ed25519.pub on the Pod.
# ─────────────────────────────────────────────────────────────────────────────

rendezvous_server = "palpod.local:21116"
nat_type = 1
serial = 0

[options]
custom-rendezvous-server = "palpod.local"
relay-server = "palpod.local"
api-server = ""
# Paste the *base64* Ed25519 public key that `generate-keys.sh` printed here.
# It's the single-line value that comes out of id_ed25519.pub.
key = "REPLACE_ME_WITH_id_ed25519.pub_CONTENTS"

# Force encryption; refuse to fall back to unencrypted sessions.
enable-directx-capture = "N"
allow-linux-headless = "N"
verification-method = "use-permanent-password"
