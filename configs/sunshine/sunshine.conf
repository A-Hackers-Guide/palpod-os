# ─────────────────────────────────────────────────────────────────────────────
# Sunshine — PAL Pod defaults.
#
# Sunshine is a Moonlight-compatible game/desktop streaming host. Clients
# (Moonlight on TV, phone, tablet) pair by PIN via the web UI at
# https://<pod-ip>:47990. Streams flow over 47984–48010 (TCP + UDP).
#
# GPU: On the Jetson AGX Orin, Sunshine uses the tegra_video encoder via
# NVENC. On x86 with a discrete NVIDIA card it uses nvenc directly.
# ─────────────────────────────────────────────────────────────────────────────

# --- Network -----------------------------------------------------------------
# Bind everywhere so LAN clients can connect. Firewall at the router, not here.
address_family = both
port = 47989

# Where Sunshine listens for its web UI (HTTPS with a self-signed cert
# it generates on first launch).
sunshine_name = PAL Pod
# origin_web_ui_allowed = pc means only same-machine access. `lan` is what
# we want so Moonlight tablets can pair.
origin_web_ui_allowed = lan

# --- Stream defaults ---------------------------------------------------------
# The PAL Pod ships with a 4K OLED expectation but 1440p60 is the default
# stream — it survives contention on a busy home network far better than 4K.
min_log_level = info
fps = [30, 60, 90, 120]
resolutions = [
  "1920x1080",
  "2560x1440",
  "3840x2160"
]
default_resolution = 2560x1440
default_fps = 60

# HDR: enable if your source (Steam game / desktop) is producing HDR frames.
# Moonlight clients that don't support HDR will fall back to SDR automatically.
enable_hdr = enabled

# --- Encoder -----------------------------------------------------------------
# Try nvenc first (works on x86 + Jetson), fall back to software.
encoder = nvenc
nvenc_preset = 5           # p5 = balanced. Bump to 3 (slower) for higher quality.
nvenc_h264_cavlc = disabled
nvenc_realtime_hags = enabled

# --- Audio -------------------------------------------------------------------
# Use the default host audio device. Configure per-app overrides in the web UI.
audio_sink = auto
virtual_sink =

# --- Input -------------------------------------------------------------------
# uinput lets Sunshine synthesise keyboard/mouse/gamepad events. The compose
# file mounts /dev/uinput into the container.
keyboard = enabled
mouse = enabled
controller = enabled
back_button_timeout = 2000
gamepad = auto

# --- Client authorisation ----------------------------------------------------
# Empty list = allow any client to attempt pairing (still needs the PIN).
# For a tightly-controlled home fill in MAC addresses of the family's devices.
allowed_client_macs = []

# --- Sphere protection -------------------------------------------------------
# CRITICAL: Sunshine must NEVER stream to the Sphere face. pal-face owns the
# HDMI output exclusively. This is enforced two ways:
#   1. pal-face grabs /dev/fb0 first via the compose privileged flag.
#   2. Sunshine's `output_name` is pinned to a virtual X display, not HDMI-0.
output_name = :99
