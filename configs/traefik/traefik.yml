# ─────────────────────────────────────────────────────────────────────────────
# Traefik static config for PAL Pod.
#
# TLS strategy: Everything served on *.palpod.local uses a self-signed root
# generated by scripts/first-boot.sh. The root cert is written to
# /var/lib/palpod/traefik/certs/root.pem and must be installed on every LAN
# client that wants a browser padlock.
#
# If you prefer nginx instead, delete this file, drop the traefik service from
# docker-compose.yml, and add an nginx service that reverse-proxies:
#   plex.palpod.local   -> http://plex:32400
#   jelly.palpod.local  -> http://jellyfin:8096
#   books.palpod.local  -> http://audiobookshelf:80
#   xteve.palpod.local  -> http://xteve:34400
#   pod.palpod.local    -> http://pal-web:3000
# The dynamic Traefik file at configs/traefik/dynamic/ is a good reference for
# the routes.
# ─────────────────────────────────────────────────────────────────────────────

api:
  dashboard: true
  insecure: true            # bound to 127.0.0.1 only in docker-compose.yml

log:
  level: INFO
  format: json

accessLog:
  filePath: /var/log/traefik/access.log
  format: json

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: palpod
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Ping endpoint used by the container healthcheck.
ping:
  entryPoint: traefik
