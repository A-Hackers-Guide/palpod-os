# TLS: point Traefik at the self-signed cert generated by first-boot.sh.
tls:
  certificates:
    - certFile: /certs/palpod.local.crt
      keyFile:  /certs/palpod.local.key
  stores:
    default:
      defaultCertificate:
        certFile: /certs/palpod.local.crt
        keyFile:  /certs/palpod.local.key
