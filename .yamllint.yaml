extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  colons:
    max-spaces-after: -1        # GitHub Actions uses aligned colons
  braces:
    max-spaces-inside: 1        # allow ${{ expr }} style
  brackets:
    max-spaces-inside: 1

ignore: |
  .venv/
  node_modules/
  **/__pycache__/
  hardware/electrical/kicad/
