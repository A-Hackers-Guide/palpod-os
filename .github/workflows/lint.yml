---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.6.9

      - name: Run ruff check
        run: ruff check .

  shellcheck:
    name: shellcheck (shell scripts)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -euo pipefail
          scripts=()
          for f in install.sh uninstall.sh update.sh; do
            if [ -f "$f" ]; then
              scripts+=("$f")
            fi
          done
          while IFS= read -r -d '' f; do
            scripts+=("$f")
          done < <(find scripts -maxdepth 3 -type f -name '*.sh' -print0)

          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found to check."
            exit 0
          fi

          printf 'Checking: %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  yamllint:
    name: yamllint (YAML)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install yamllint
        run: python -m pip install --upgrade pip yamllint==1.35.1

      - name: Run yamllint
        run: yamllint .

  markdownlint:
    name: markdownlint (Markdown)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.14.0

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#**/.venv/**"
