[project]
name = "palweb"
version = "0.2.0"
description = "PAL Pod control-plane web service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "httpx>=0.27",
    "websockets>=12.0",
    # Password hashing for /api/auth/login. Falls back to stdlib scrypt if
    # missing, but argon2 is the reviewer-recommended default.
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
