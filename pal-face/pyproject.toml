[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palface"
version = "0.1.0"
description = "PAL Face Renderer — procedural Pygame face for the PAL Pod round OLED display."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PAL Pod" }]
license = { text = "Proprietary" }
dependencies = [
    "pygame-ce>=2.5.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
palface = "palface.__main__:main"

[tool.setuptools.packages.find]
include = ["palface*"]
exclude = ["tests*", "scripts*"]
